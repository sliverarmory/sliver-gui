[package]
name = "rdp-graphics-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironrdp-graphics = { git = "https://github.com/sliverarmory/IronRDP", rev = "1835457f27045d0098a4861b7b50204539539ec6" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = "none"
panic = "abort"

[profile.release.build-override]
strip = "none"
