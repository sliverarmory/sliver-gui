[package]
name = "sliver-rdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# Verified source staging pins the original commit and reviewed local patch.
# Run npm run test:rdp:native or npm run build:rdp:host to prepare vendor/ironrdp.
ironrdp-client = { path = "vendor/ironrdp/crates/ironrdp-client", default-features = false, features = ["rustls", "clipboard-custom"] }
ironrdp-pdu = { path = "vendor/ironrdp/crates/ironrdp-pdu" }
ironrdp-connector = { path = "vendor/ironrdp/crates/ironrdp-connector" }
ironrdp-core = { path = "vendor/ironrdp/crates/ironrdp-core" }
ironrdp-tls = { path = "vendor/ironrdp/crates/ironrdp-tls", features = ["rustls"] }
ironrdp-cliprdr = { path = "vendor/ironrdp/crates/ironrdp-cliprdr" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"

[profile.release]
lto = "thin"
# Rust 1.94.1's Mach-O strip can misalign LINKEDIT on macOS 27 (rust-lang/rust#157750).
strip = "none"
panic = "abort"

[profile.release.build-override]
strip = "none"
