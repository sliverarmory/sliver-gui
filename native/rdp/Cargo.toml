[package]
name = "sliver-rdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# Pin the reviewed commit on the fork's default branch (master).
# Keep the exact revision and protocol/ironrdp-provenance.json in sync.
ironrdp-client = { git = "https://github.com/sliverarmory/IronRDP", rev = "bfa5a8966fce80d659765c018895036ec775a012", default-features = false, features = ["rustls", "clipboard-custom"] }
ironrdp-pdu = { git = "https://github.com/sliverarmory/IronRDP", rev = "bfa5a8966fce80d659765c018895036ec775a012" }
ironrdp-connector = { git = "https://github.com/sliverarmory/IronRDP", rev = "bfa5a8966fce80d659765c018895036ec775a012" }
ironrdp-core = { git = "https://github.com/sliverarmory/IronRDP", rev = "bfa5a8966fce80d659765c018895036ec775a012" }
ironrdp-tls = { git = "https://github.com/sliverarmory/IronRDP", rev = "bfa5a8966fce80d659765c018895036ec775a012", features = ["rustls"] }
ironrdp-cliprdr = { git = "https://github.com/sliverarmory/IronRDP", rev = "bfa5a8966fce80d659765c018895036ec775a012" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"

[profile.release]
lto = "thin"
# Rust 1.94.1's Mach-O strip can misalign LINKEDIT on macOS 27 (rust-lang/rust#157750).
strip = "none"
panic = "abort"

[profile.release.build-override]
strip = "none"
