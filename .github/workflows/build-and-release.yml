name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  protocol-parity:
    name: Protocol and parity drift
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up exact Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false

      - name: Set up exact npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install exact production client dependency
        env:
          npm_config_engine_strict: "true"
        run: npm ci --omit=dev --ignore-scripts

      - name: Verify native console build and provenance helper
        run: node --test scripts/buildSliverConsole.test.mjs scripts/prepareNodePtyRuntime.test.mjs

      - name: Verify protocol, parity, and client package provenance
        run: npm run protocol:check

  application-e2e:
    name: Electron current-slice E2E
    # Keep this check visible while its CI execution is disabled.
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up exact npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Require HeroUI Pro CI token
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: node -e "if (!process.env.HEROUI_AUTH_TOKEN) { console.error('::error::Add a HEROUI_AUTH_TOKEN Actions secret before running builds.'); process.exit(1); }"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
          npm_config_engine_strict: "true"
        run: npm ci --strict-allow-scripts

      - name: Verify pinned terminal runtime
        run: npm run protocol:ghostty

      - name: Exercise renderer, preload, IPC, and registry
        run: xvfb-run --auto-servernum npm run test:e2e:electron

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sliver-gui-electron-e2e-diagnostics
          path: |
            artifacts/e2e/
            artifacts/app-icons/
            artifacts/window-navigation/
            artifacts/keyboard-shortcuts/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - protocol-parity
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.ref_type == 'tag' && 'release' || 'ci' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            runner: macos-15
            build_args: --mac --universal
            packaged_smoke: npm run test:e2e:packaged
            update_platform: macos
            app_update_path: release/mac-universal/Sliver GUI.app/Contents/Resources/app-update.yml
            artifact_name: sliver-gui-macos-universal
            artifact_paths: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - platform: Windows x64
            runner: windows-2022
            build_args: --win --x64
            packaged_smoke: npm run test:e2e:packaged
            update_platform: windows
            app_update_path: release/win-unpacked/resources/app-update.yml
            artifact_name: sliver-gui-windows-x64
            artifact_paths: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - platform: Linux x64
            runner: ubuntu-22.04
            build_args: --linux --x64
            packaged_smoke: xvfb-run --auto-servernum npm run test:e2e:packaged
            update_platform: linux
            app_update_path: release/linux-unpacked/resources/app-update.yml
            artifact_name: sliver-gui-linux-x64
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    steps:
      - name: Require LF Git checkouts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Sliver console source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BishopFox/sliver
          ref: f8430cecf7ceb5cb332c84fb36aba9b75188802d
          path: sliver
          persist-credentials: false

      - name: Set up exact Go for the native console
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Require HeroUI Pro CI token
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: node -e "if (!process.env.HEROUI_AUTH_TOKEN) { console.error('::error::Add a HEROUI_AUTH_TOKEN Actions secret before running builds.'); process.exit(1); }"

      - name: Install dependencies
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
          npm_config_engine_strict: "true"
        run: npm ci --strict-allow-scripts

      - name: Record macOS build host
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m

      - name: Record Windows build host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture

      - name: Record Linux build host
        if: runner.os == 'Linux'
        run: |
          cat /etc/os-release
          uname -m
          ldd --version | head -n 1

      - name: Set and verify exact version from tag
        if: github.ref_type == 'tag'
        run: |
          node ./scripts/verifyReleaseVersion.mjs --tag "${{ github.ref_name }}" --allow-package-mismatch
          npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
          node ./scripts/verifyReleaseVersion.mjs --tag "${{ github.ref_name }}"

      - name: Require release tag at the reviewed main commit
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must point at the current reviewed origin/main commit."
            exit 1
          fi

      - name: Require macOS signing and notarization secrets
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node ./scripts/verifyReleaseSigningEnvironment.mjs --platform macos

      - name: Require Windows signing secrets
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
        run: node ./scripts/verifyReleaseSigningEnvironment.mjs --platform windows

      - name: Run tests
        run: npm test

      - name: Prepare native packages
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run predist

      - name: Build unsigned CI packages
        if: github.ref_type != 'tag'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node ./node_modules/electron-builder/cli.js ${{ matrix.build_args }} --publish never

      - name: Build signed and notarized macOS release packages
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node ./node_modules/electron-builder/cli.js ${{ matrix.build_args }} --publish never --config.forceCodeSigning=true

      - name: Build signed Windows release packages
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
        run: node ./node_modules/electron-builder/cli.js ${{ matrix.build_args }} --publish never --config.forceCodeSigning=true --config.win.signtoolOptions.publisherName="$env:WIN_CSC_PUBLISHER_NAME"

      - name: Build Linux release packages
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node ./node_modules/electron-builder/cli.js ${{ matrix.build_args }} --publish never

      - name: Verify native packages
        env:
          SLIVER_GUI_REQUIRE_SIGNED_CHILD: ${{ github.ref_type == 'tag' && runner.os != 'Linux' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
        run: npm run postdist

      - name: Verify macOS signature, notarization, and stapling
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        run: |
          app_path="release/mac-universal/Sliver GUI.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Verify Windows Authenticode signatures
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @(
            "release/sliver-gui-$version-windows-x64-setup.exe",
            "release/sliver-gui-$version-windows-x64-portable.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing signed Windows release asset: $asset"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $asset
            if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) {
              throw "Invalid Authenticode signature for $asset: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -cne $env:WIN_CSC_PUBLISHER_NAME) {
              throw "Unexpected Authenticode publisher subject for $asset"
            }
          }

      - name: Verify updater metadata and native asset inventory
        if: github.ref_type != 'tag' || runner.os != 'Windows'
        run: node ./scripts/verifyUpdateArtifacts.mjs --platform "${{ matrix.update_platform }}" --app-update "${{ matrix.app_update_path }}"

      - name: Verify Windows updater publisher continuity
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        env:
          WIN_CSC_PUBLISHER_NAME: ${{ vars.WIN_CSC_PUBLISHER_NAME }}
        run: node ./scripts/verifyUpdateArtifacts.mjs --platform windows --app-update "${{ matrix.app_update_path }}" --publisher-name "$env:WIN_CSC_PUBLISHER_NAME"

      - name: Exercise packaged mTLS application
        timeout-minutes: 10
        env:
          DEBUG: ${{ runner.os == 'Windows' && 'pw:browser' || '' }}
        run: ${{ matrix.packaged_smoke }}

      - name: Upload packaged-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-smoke-diagnostics
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

      - name: Upload native packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  release:
    name: Verify and publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Require a public update repository
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh repo view --json visibility --jq .visibility)"
          if [ "$visibility" != "PUBLIC" ]; then
            echo "::error::Stable automatic updates require the GitHub repository and release assets to be public; found $visibility."
            exit 1
          fi
          immutable="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq .enabled)"
          if [ "$immutable" != "true" ]; then
            echo "::error::Enable GitHub immutable releases before publishing a stable automatic update."
            exit 1
          fi

      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sliver-gui-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release and updater inventory
        run: |
          node ./scripts/verifyReleaseVersion.mjs --tag "$GITHUB_REF_NAME" --allow-package-mismatch
          version="${GITHUB_REF_NAME#v}"
          node ./scripts/verifyUpdateArtifacts.mjs --directory release-assets --platform all --version "$version"

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum latest*.yml sliver-gui-* > SHA256SUMS

      - name: Verify checksums cover the exact release inventory
        run: |
          version="${GITHUB_REF_NAME#v}"
          node ./scripts/verifyUpdateArtifacts.mjs --directory release-assets --platform all --version "$version" --checksums SHA256SUMS

      - name: Create or update draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Sliver GUI $GITHUB_REF_NAME"
          elif [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Refusing to replace assets on a published or immutable release."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

      - name: Verify uploaded draft release inventory
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-release-assets.txt
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > /tmp/uploaded-release-assets.txt
          diff -u /tmp/expected-release-assets.txt /tmp/uploaded-release-assets.txt

      - name: Publish verified release for automatic updates
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')" = $'false\tfalse'
