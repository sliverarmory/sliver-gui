name: Request signed release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  actions: write

jobs:
  request:
    name: Dispatch release from main
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # This relay checks out no tag-controlled code and has no environment
      # secrets. The main workflow independently verifies the tag and commit.
      - name: Request a build on main
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must be exact stable SemVer tags."
            exit 1
          fi
          gh workflow run build-and-release.yml --ref main --field release_tag="$RELEASE_TAG"
